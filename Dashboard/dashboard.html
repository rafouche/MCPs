<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altec Network Operations Center</title>
<style>
  :root {
    --header-h: 52px;
    --app-pad: 16px;
    --bg-void: #0A0D12;
    --bg-panel: #12161D;
    --hairline: #232935;
    --text-primary: #E7EAEE;
    --text-muted: #6E7787;
    --text-dim: #454C5A;
    --green: #34D399;
    --red: #FB5B4E;
    --amber: #F5B759;
    --wire: #5B8DEF;
    --violet: #A78BFA;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-void); color: var(--text-primary); font-family: var(--sans); height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); padding: 0 24px; border-bottom: 1px solid var(--hairline); flex-shrink: 0; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wire); }
  .wordmark { font-weight: 700; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; }
  .wordmark span { color: var(--text-muted); font-weight: 400; }
  .version-badge {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
    border: 1px solid var(--hairline); border-radius: 10px; padding: 2px 8px;
    letter-spacing: 0.02em; cursor: default;
  }
  .clock { font-family: var(--mono); font-size: 18px; color: var(--text-muted); }

  #app { flex: 1; overflow: hidden; padding: var(--app-pad); min-height: 0; box-sizing: border-box; }
  #app.mode-single { display: flex; flex-direction: column; }
  #app.mode-all {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Top row = one physical TV's height MINUS the header AND #app's own
       top padding (both eat into the top row only, since the header and
       #app's padding-top both sit above row 1 in the document). Bottom
       row = a full, uncompensated TV height, since neither the header nor
       the top padding touch it. dvh units are always relative to the true
       root viewport regardless of nesting, so this stays correct even
       though #app sits below the header and inside its own padding.
       Assumes a 2-row physical arrangement (top two TVs / bottom two TVs) —
       if the physical layout ever changes, this is the formula to revisit. */
    grid-template-rows: calc(50dvh - var(--header-h) - var(--app-pad)) 50dvh;
    gap: 14px;
  }

  .zone { background: var(--bg-panel); border: 1px solid var(--hairline); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .mode-single .zone { flex: 1; }

  .zone-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--hairline); flex-shrink: 0; }
  .zone-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
  .zone-title .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .zone-meta { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
  .zone-meta.stale { color: var(--amber); }
  .zone-meta.demo { color: var(--wire); }
  .zone-body { flex: 1; overflow-y: auto; padding: 14px 16px; font-size: 15px; min-height: 0; }

  .chip-row { display: flex; align-items: center; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--hairline); flex-shrink: 0; overflow-x: auto; }
  .chip-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); flex-shrink: 0; margin-right: 2px; }
  .chip {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 12px; border: 1px solid var(--hairline);
    background: transparent; color: var(--text-muted); cursor: pointer; white-space: nowrap;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--text-muted); color: var(--text-primary); }
  .chip.active { background: var(--wire); border-color: var(--wire); color: #0A0D12; font-weight: 700; }

  .zone--network .swatch { background: var(--wire); }
  .zone--tickets .swatch { background: var(--amber); }
  .zone--security .swatch { background: var(--red); }
  .zone--business .swatch { background: var(--violet); }

  .stat-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 100px; background: rgba(255,255,255,0.02); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; }
  .stat-num { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-family: var(--mono); font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-badge { font-family: var(--mono); font-size: 12.5px; padding: 4px 9px; border-radius: 4px; flex-shrink: 0; white-space: nowrap; }
  .badge-crit { background: rgba(251,91,78,0.15); color: var(--red); border: 1px solid rgba(251,91,78,0.35); }
  .badge-hold { background: rgba(110,119,135,0.15); color: var(--text-muted); border: 1px solid var(--hairline); }
  .badge-high { background: rgba(245,183,89,0.15); color: var(--amber); border: 1px solid rgba(245,183,89,0.35); }
  .badge-info { background: rgba(91,141,239,0.15); color: var(--wire); border: 1px solid rgba(91,141,239,0.35); }

  .empty-state { color: var(--text-dim); font-family: var(--mono); font-size: 13.5px; text-align: center; padding: 24px 0; }

  .net-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .net-tile { border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; background: rgba(255,255,255,0.02); }
  .net-tile.down { border-color: rgba(251,91,78,0.5); background: rgba(251,91,78,0.06); }
  .net-tile .nt-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .net-tile .nt-dev { font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .net-tile .nt-status { font-family: var(--mono); font-size: 12px; margin-top: 4px; color: var(--green); }
  .net-tile.down .nt-status { color: var(--red); }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="wordmark">ALTEC <span>NETWORK OPERATIONS CENTER</span></div>
    <div class="version-badge" id="versionBadge" title="Bump minor (1.2, 1.2.5, 1.3...) for regular updates; bump to 2.0 for major/breaking changes"></div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div id="app"></div>

<script>
  // ============================================================
  // CONFIG
  // Every endpoint below is one of your Cloudflare Workers. Nothing else
  // needs to run anywhere — this file is the entire client. Edit these
  // five URLs if your account subdomain differs from young-math-a33a.
  //
  // URL params on this file itself:
  //   ?zone=network|tickets|security|business|all   (default: all)
  //   ?demo=1               force demo data everywhere
  //   ?ninja=<url> etc.     override any single endpoint at load time
  // ============================================================
  // Bump this on every meaningful change: 1.1 -> 1.2 -> 1.2.5 -> 1.3 for
  // regular updates; jump to 2.0 only for a major/breaking change (new
  // zone structure, changed endpoint contract, etc).
  const APP_VERSION = '1.3';
  document.getElementById('versionBadge').textContent = 'v' + APP_VERSION;

  const ENDPOINTS = {
    ninja:    "https://ninjarmm-mcp.young-math-a33a.workers.dev/status",
    halo:     "https://halopsa-mcp.young-math-a33a.workers.dev/status",
    meraki:   "https://meraki-mcp.young-math-a33a.workers.dev/status",
    merakiLicenses: "https://meraki-mcp.young-math-a33a.workers.dev/licenses",
    peplink:  "https://peplink-mcp.young-math-a33a.workers.dev/status",
    peplinkLicenses: "https://peplink-mcp.young-math-a33a.workers.dev/licenses",
    unifi:    "https://unifi-mcp.young-math-a33a.workers.dev/status",
    cipp:     "https://cipp-mcp.young-math-a33a.workers.dev/status",
    huntress: "https://huntress-mcp.young-math-a33a.workers.dev/api/huntress", // raw REST base
    pax8:     "https://pax8-mcp.young-math-a33a.workers.dev/api/pax8",         // raw REST base
  };
  const POLL_MS = 30000;

  const params = new URLSearchParams(location.search);
  const zoneParam = params.get('zone') || 'all';
  const forceDemo = params.get('demo') === '1';
  const hideHeader = params.get('header') === '0';
  if (hideHeader) document.querySelector('.topbar').style.display = 'none';
  Object.keys(ENDPOINTS).forEach(k => {
    const override = params.get(k);
    if (override) ENDPOINTS[k] = override;
  });

  const ZONES = {
    network:  { title: 'Network',      render: renderNetwork,  demo: demoNetwork,  fetchZone: fetchNetworkZone,
      filters: [{ key: 'all', label: 'All' }, { key: 'ninja', label: 'Ninja' }, { key: 'meraki', label: 'Meraki' }, { key: 'peplink', label: 'Peplink' }, { key: 'unifi', label: 'UniFi' }],
      sorts: [{ key: 'priority', label: 'Priority' }, { key: 'az', label: 'A–Z' }] },
    tickets:  { title: 'Tickets & SLA', render: renderTickets,  demo: demoTickets,  fetchZone: () => fetchOne(ENDPOINTS.halo),
      filters: [{ key: 'all', label: 'All' }, { key: 'unassigned', label: 'Unassigned' }, { key: 'overdue', label: 'Overdue' }, { key: 'waitingOnUs', label: 'Waiting On Us' }, { key: 'waitingOnClient', label: 'Waiting On Client' }],
      sorts: [{ key: 'priority', label: 'Priority' }, { key: 'oldest', label: 'Oldest First' }, { key: 'newest', label: 'Newest First' }] },
    security: { title: 'Security',     render: renderSecurity, demo: demoSecurity, fetchZone: fetchSecurityZone,
      filters: [{ key: 'all', label: 'All' }, { key: 'huntress', label: 'Huntress' }, { key: 'cipp', label: 'M365 Posture' }, { key: 'avanan', label: 'Avanan' }],
      sorts: [{ key: 'priority', label: 'Priority' }, { key: 'newest', label: 'Newest First' }] },
    business: { title: 'Business',     render: renderBusiness, demo: demoBusiness, fetchZone: fetchBusinessZone,
      filters: [{ key: 'all', label: 'All' }, { key: 'pax8', label: 'Pax8' }, { key: 'meraki', label: 'Meraki' }, { key: 'peplink', label: 'Peplink' }],
      sorts: [{ key: 'priority', label: 'Priority' }, { key: 'mrr', label: 'Highest $' }, { key: 'az', label: 'A–Z' }] },
  };

  // Filter/sort state: URL params win on load; chip clicks change them live
  // after that. Both write to the same state — one source of truth.
  const filterState = {};
  const sortState = {};
  Object.keys(ZONES).forEach(key => {
    filterState[key] = params.get(key + 'Filter') || 'all';
    sortState[key] = params.get(key + 'Sort') || 'priority';
  });
  const lastData = {}; // cache of last-fetched (or demo) data per zone, so a chip click re-renders without re-fetching

  const app = document.getElementById('app');
  const activeZones = zoneParam === 'all' ? Object.keys(ZONES) : [zoneParam];
  app.className = zoneParam === 'all' ? 'mode-all' : 'mode-single';

  function buildChipRow(key, kind, options, current) {
    const chips = options.map(o =>
      `<button class="chip${current === o.key ? ' active' : ''}" data-zone="${key}" data-kind="${kind}" data-value="${o.key}">${escapeHtml(o.label)}</button>`
    ).join('');
    return `<div class="chip-row" id="${kind}s-${key}"><span class="chip-label">${kind === 'filter' ? 'Show' : 'Sort'}</span>${chips}</div>`;
  }

  activeZones.forEach(key => {
    const z = ZONES[key];
    if (!z) return;
    const el = document.createElement('div');
    el.className = 'zone zone--' + key;
    el.innerHTML = `
      <div class="zone-head">
        <div class="zone-title"><span class="swatch"></span>${z.title}</div>
        <div class="zone-meta" id="meta-${key}">connecting…</div>
      </div>
      ${z.filters ? buildChipRow(key, 'filter', z.filters, filterState[key]) : ''}
      ${z.sorts ? buildChipRow(key, 'sort', z.sorts, sortState[key]) : ''}
      <div class="zone-body" id="body-${key}"></div>
    `;
    app.appendChild(el);
  });

  // Event delegation on #app for chip clicks — works regardless of how many
  // zones are on screen, no per-chip listener wiring needed. Handles both
  // filter chips and sort chips through the same mechanism.
  app.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const key = chip.dataset.zone;
    const kind = chip.dataset.kind; // 'filter' or 'sort'
    const value = chip.dataset.value;
    const state = kind === 'filter' ? filterState : sortState;
    state[key] = value;

    // Reflect in the URL so a kiosk reload (or bookmarking this state)
    // preserves the choice — history.replaceState doesn't add a back-button
    // entry, which matters for a screen nobody's meant to navigate away from.
    const url = new URL(location.href);
    url.searchParams.set(key + (kind === 'filter' ? 'Filter' : 'Sort'), value);
    history.replaceState(null, '', url);

    document.querySelectorAll(`#${kind}s-${key} .chip`).forEach(c => c.classList.toggle('active', c.dataset.value === value));
    if (lastData[key]) ZONES[key].render(lastData[key], filterState[key], sortState[key]);
  });

  function tickClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: true });
  }
  setInterval(tickClock, 1000); tickClock();

  function setMeta(key, text, cls) {
    const m = document.getElementById('meta-' + key);
    if (m) { m.textContent = text; m.className = 'zone-meta' + (cls ? ' ' + cls : ''); }
  }

  async function fetchOne(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function pollZone(key) {
    const z = ZONES[key];
    if (!z) return;
    if (forceDemo) {
      lastData[key] = z.demo();
      z.render(lastData[key], filterState[key], sortState[key]);
      setMeta(key, 'DEMO DATA', 'demo');
      return;
    }
    try {
      const data = await z.fetchZone();
      lastData[key] = data;
      z.render(data, filterState[key], sortState[key]);
      setMeta(key, 'synced ' + new Date().toLocaleTimeString('en-US', { hour12: true }));
    } catch (err) {
      lastData[key] = z.demo();
      z.render(lastData[key], filterState[key], sortState[key]);
      setMeta(key, 'DEMO — ' + err.message, 'demo');
    }
  }

  async function pollAll() {
    await refreshInactiveClients();
    activeZones.forEach(pollZone);
  }
  pollAll();
  setInterval(pollAll, POLL_MS);

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }
  function minutesSince(iso) {
    const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  }
  // Renewal dates arrive pre-formatted as short strings ("Aug 3") from the
  // Workers, with no raw ISO value alongside them. This reconstructs a
  // sortable date using the current year, rolling forward a year if that
  // lands more than ~6 months in the past — safe here since renewals are
  // always near-future by construction (30-60 day windows).
  function parseShortDate(str) {
    if (!str) return null;
    const d = new Date(str + ' ' + new Date().getFullYear());
    if (isNaN(d.getTime())) return null;
    if (d.getTime() < Date.now() - 180 * 24 * 3600 * 1000) d.setFullYear(d.getFullYear() + 1);
    return d;
  }

  // ================= CROSS-VENDOR ORG CORRELATION =================
  // Different vendors often name the same real client differently (Meraki:
  // "Springfield Brewing Co", Peplink: "SBC"). Without this, they render as
  // two separate tiles instead of one merged view of the same client.
  // This is a manually-maintained alias table on purpose — automatic fuzzy
  // matching risks silently merging two DIFFERENT real clients that happen
  // to have similar names, which is worse than the current problem. Add an
  // entry here whenever you spot a mismatch; key is lowercase, value is the
  // canonical display name to use everywhere.
  const ORG_ALIASES = {
    'sbc': 'Springfield Brewing Co',
    'springfield brewing company': 'Springfield Brewing Co',
  };
  function canonicalOrgName(name) {
    const key = (name || '').trim().toLowerCase();
    return ORG_ALIASES[key] || name;
  }

  // ================= INACTIVE CLIENT FILTER (HaloPSA is source of truth) =================
  // Some vendor systems (Meraki, Peplink, Pax8, Huntress, CIPP...) keep showing
  // orgs for clients we've fully offboarded, because the new provider hasn't
  // pulled our API access yet. Halo's /status now returns inactiveClients
  // (see halopsa-mcp/src/index.ts), so every zone is filtered against it here
  // rather than trusting each vendor to know a client left. Halo's own ticket
  // stats are already filtered server-side; this covers the other three zones.
  // ?showInactive=1 bypasses this for auditing what still has us connected.
  const showInactive = params.get('showInactive') === '1';
  let inactiveClientNames = new Set();
  function isInactiveClient(name) {
    if (showInactive || !name) return false;
    return inactiveClientNames.has(canonicalOrgName(name).trim().toLowerCase());
  }
  async function refreshInactiveClients() {
    if (showInactive) return;
    try {
      const data = await fetchOne(ENDPOINTS.halo);
      inactiveClientNames = new Set((data.inactiveClients || []).map(n => canonicalOrgName(n).trim().toLowerCase()));
    } catch (err) {
      // leave the previous set in place — Halo being briefly unreachable
      // shouldn't suddenly un-hide clients confirmed inactive last poll
    }
  }

  // ================= NETWORK (Ninja + Meraki, merged client-side) =================
  async function fetchNetworkZone() {
    const [ninjaResult, merakiResult, peplinkResult, unifiResult] = await Promise.allSettled([
      fetchOne(ENDPOINTS.ninja),
      fetchOne(ENDPOINTS.meraki),
      fetchOne(ENDPOINTS.peplink),
      fetchOne(ENDPOINTS.unifi),
    ]);
    const ninjaLive = ninjaResult.status === 'fulfilled';
    const anyLive = [ninjaResult, merakiResult, peplinkResult, unifiResult].some(r => r.status === 'fulfilled');
    if (!anyLive) throw new Error('all network sources unreachable');

    const ninja = ninjaLive ? ninjaResult.value : null;
    // Meraki, Peplink, and UniFi all return the same { networks: [...] } shape —
    // that's a deliberate contract so any org-health-style source can be added
    // here later just by appending one more fetchOne + concat, same pattern.
    // orgName is canonicalized here so the same real client always groups
    // together regardless of which vendor's name for it was used.
    const merakiNetworks = (merakiResult.status === 'fulfilled' ? (merakiResult.value.networks || []) : []).map(n => ({ ...n, orgName: canonicalOrgName(n.orgName), vendor: 'Meraki' }));
    const peplinkNetworks = (peplinkResult.status === 'fulfilled' ? (peplinkResult.value.networks || []) : []).map(n => ({ ...n, orgName: canonicalOrgName(n.orgName), vendor: 'Peplink' }));
    const unifiNetworks = (unifiResult.status === 'fulfilled' ? (unifiResult.value.networks || []) : []).map(n => ({ ...n, orgName: canonicalOrgName(n.orgName), vendor: 'UniFi' }));

    return {
      devices: ((ninja && ninja.devices) || demoNetwork().devices).filter(d => !isInactiveClient(d.client)),
      merakiNetworks: [...merakiNetworks, ...peplinkNetworks, ...unifiNetworks].filter(n => !isInactiveClient(n.orgName)),
      ninjaLive,
    };
  }
  function renderNetwork(data, filter, sort) {
    filter = filter || 'all';
    sort = sort || 'priority';
    const body = document.getElementById('body-network');
    const allDevices = data.devices || [];
    const allOrgs = data.merakiNetworks || [];

    // 'ninja' shows only individually-tracked devices; any org-vendor name
    // shows only that vendor's org tiles; 'all' shows everything. Filtering
    // happens here, on already-fetched data — no re-fetch on chip click.
    const devices = (filter === 'all' || filter === 'ninja') ? allDevices : [];
    const merakiNetworks = filter === 'ninja' ? [] : filter === 'all' ? allOrgs : allOrgs.filter(n => (n.vendor || '').toLowerCase() === filter);

    const down = devices.filter(d => d.status === 'offline');
    const orgTotalDevices = merakiNetworks.reduce((sum, n) => sum + (n.totalDevices || 0), 0);
    const orgOfflineDevices = merakiNetworks.reduce((sum, n) => sum + (n.offlineCount || 0), 0);
    const totalDevices = devices.length + orgTotalDevices;
    const totalDown = down.length + orgOfflineDevices;
    const totalOnline = totalDevices - totalDown;

    // Merge same-named orgs across vendors (post-alias-canonicalization)
    // into one combined tile instead of one tile per vendor per org — this
    // is what fixes SBC showing only its Peplink devices while its Meraki
    // devices sat in a separate, easy-to-miss tile.
    const orgGroups = new Map();
    merakiNetworks.forEach(n => {
      if (!orgGroups.has(n.orgName)) orgGroups.set(n.orgName, { orgName: n.orgName, totalDevices: 0, offlineCount: 0, vendors: [] });
      const g = orgGroups.get(n.orgName);
      g.totalDevices += n.totalDevices || 0;
      g.offlineCount += n.offlineCount || 0;
      g.vendors.push({ vendor: n.vendor, totalDevices: n.totalDevices || 0, offlineCount: n.offlineCount || 0 });
    });
    const groupedOrgs = [...orgGroups.values()];

    // Normalize both device-tiles (Ninja) and org-tiles (Meraki/Peplink/
    // UniFi) into one common shape so they can be sorted TOGETHER, not as
    // two sequential blocks. Otherwise a healthy tile from one source could
    // sit above a broken tile from another just because of render order —
    // "worst on top" has to mean globally worst, not worst-within-its-block.
    const tiles = [
      ...devices.map(d => ({
        name: d.client, severity: d.status === 'offline' ? 1 : 0,
        html: `<div class="net-tile ${d.status === 'offline' ? 'down' : ''}">
          <div class="nt-name">${escapeHtml(d.client)}</div>
          <div class="nt-dev">${escapeHtml(d.name)}</div>
          <div class="nt-status">${d.status === 'online' ? 'ONLINE' : 'DOWN · ' + minutesSince(d.lastContact)}</div>
        </div>`
      })),
      ...groupedOrgs.map(n => {
        const vendorLine = n.vendors.length > 1
          ? n.vendors.map(v => `${v.vendor} ${v.totalDevices}${v.offlineCount > 0 ? ' (' + v.offlineCount + ' down)' : ''}`).join(' · ')
          : `${n.vendors[0].vendor} · ${n.totalDevices} device${n.totalDevices === 1 ? '' : 's'}`;
        return {
          name: n.orgName, severity: n.offlineCount > 0 ? (n.offlineCount / Math.max(n.totalDevices, 1)) : 0,
          html: `<div class="net-tile ${n.offlineCount > 0 ? 'down' : ''}">
            <div class="nt-name">${escapeHtml(n.orgName)}</div>
            <div class="nt-dev">${escapeHtml(vendorLine)}</div>
            <div class="nt-status">${n.offlineCount > 0 ? n.offlineCount + '/' + n.totalDevices + ' OFFLINE' : 'ALL ONLINE'}</div>
          </div>`
        };

    tiles.sort((a, b) => sort === 'az' ? a.name.localeCompare(b.name) : b.severity - a.severity);

    body.innerHTML = `
      ${data.ninjaLive === false && (filter === 'all' || filter === 'ninja') ? '<div class="empty-state" style="color:var(--wire);padding:4px 0 12px;text-align:left;">Ninja endpoint unreachable — individually-tracked tiles below are DEMO data, org-level vendors (Meraki/Peplink/UniFi) are live</div>' : ''}
      <div class="stat-row">
        <div class="stat"><div class="stat-num" style="color:${totalDown ? 'var(--red)' : 'var(--green)'}">${totalOnline}/${totalDevices}</div><div class="stat-label">Devices Online${filter !== 'all' ? '' : ' (all vendors)'}</div></div>
        <div class="stat"><div class="stat-num" style="color:${totalDown ? 'var(--red)' : 'var(--green)'}">${totalDown}</div><div class="stat-label">Down</div></div>
        ${filter === 'all' ? `<div class="stat"><div class="stat-num" style="color:${down.length ? 'var(--red)' : 'var(--green)'}">${down.length}/${allDevices.length}</div><div class="stat-label">Individually-Tracked (Ninja)</div></div>` : ''}
      </div>
      <div class="net-grid">
        ${tiles.map(t => t.html).join('')}
        ${tiles.length === 0 ? '<div class="empty-state">No devices in this view</div>' : ''}
      </div>
    `;
  }

  // ================= TICKETS (Halo — already summarized server-side) =================
  function renderTickets(data, filter, sort) {
    filter = filter || 'all';
    sort = sort || 'priority';
    const body = document.getElementById('body-tickets');
    let t = data.recentTickets || [];
    if (filter === 'unassigned') t = t.filter(x => !x.agent);
    else if (filter === 'overdue') t = t.filter(x => x.overdue);
    else if (filter === 'waitingOnUs') t = t.filter(x => !x.waitingOnClient);
    else if (filter === 'waitingOnClient') t = t.filter(x => x.waitingOnClient);

    // Priority (default): overdue and unassigned bubble to the top, oldest
    // among equals first — this is "what needs attention now", not just
    // "what's recent". On-hold tickets are excluded from that urgency
    // scoring entirely and sink below every active ticket, since a hold
    // means someone deliberately paused it — it shouldn't compete with
    // things that actually need attention right now, even if it's old.
    // Oldest/Newest give a pure age-based alternate view, unaffected by hold status.
    t = [...t].sort((a, b) => {
      if (sort === 'oldest') return (b.ageDays || 0) - (a.ageDays || 0);
      if (sort === 'newest') return (a.ageDays || 0) - (b.ageDays || 0);
      const score = x => x.onHold ? -1000 : (x.overdue ? 1000 : 0) + (!x.agent ? 500 : 0) + (x.ageDays || 0);
      return score(b) - score(a);
    });

    body.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${data.openCount ?? '—'}</div><div class="stat-label">Open (real)</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--red)">${data.overdueCount ?? '—'}</div><div class="stat-label">SLA Breach</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--amber)">${data.unassignedCount ?? '—'}</div><div class="stat-label">Unassigned</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--wire)">${data.waitingOnUsCount ?? '—'}</div><div class="stat-label">Waiting On Us</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--violet)">${data.waitingOnClientCount ?? '—'}</div><div class="stat-label">Waiting On Client</div></div>
        ${data.onHoldCount != null ? `<div class="stat"><div class="stat-num" style="color:var(--text-muted)">${data.onHoldCount}</div><div class="stat-label">On Hold</div></div>` : ''}
        ${data.alertNoiseCount != null ? `<div class="stat"><div class="stat-num" style="color:var(--text-dim)">${data.alertNoiseCount}</div><div class="stat-label">Alert Noise (excluded)</div></div>` : ''}
      </div>
      ${t.map(x => `
        <div class="row" style="${x.onHold ? 'opacity:0.55;' : ''}">
          <div class="row-main">
            <div class="row-title">${escapeHtml(x.client)} — ${escapeHtml(x.summary)}</div>
            <div class="row-sub">#${x.id} · ${escapeHtml(x.agent || 'Unassigned')} · ${escapeHtml(x.status || '')}${x.ageDays != null ? ' · ' + x.ageDays + 'd old' : ''}${x.waitingOnClient ? ' · waiting on client' : ''}</div>
          </div>
          <div class="row-badge ${x.onHold ? 'badge-hold' : x.overdue ? 'badge-crit' : x.priority === 'High' || x.priority === 'Critical' ? 'badge-high' : 'badge-info'}">${x.onHold ? 'ON HOLD' : x.overdue ? 'OVERDUE' : escapeHtml(x.priority || x.dueIn || '')}</div>
        </div>`).join('') || `<div class="empty-state">No tickets match "${escapeHtml(filter)}"</div>`}
    `;
  }
  function demoTickets() {
    return { openCount: 14, alertNoiseCount: 86, overdueCount: 2, unassignedCount: 3, waitingOnUsCount: 9, onHoldCount: 4, recentTickets: [
      { id: 10421, client: "Gold Mechanical", summary: "VPN drops intermittently", agent: "R. Fouche", status: "In Progress", priority: "High", ageDays: 2.3, overdue: true, onHold: false, dueIn: "", waitingOnClient: false },

      { id: 10415, client: "James River Ford", summary: "New user onboarding", agent: "T. Smith", status: "Pending Customer", priority: "Low", ageDays: 1.1, overdue: false, onHold: false, dueIn: "1d", waitingOnClient: true },
      { id: 10388, client: "Krueger H&A", summary: "Awaiting parts for switch replacement", agent: "R. Fouche", status: "On Hold", priority: "Medium", ageDays: 8.2, overdue: false, onHold: true, dueIn: "", waitingOnClient: false },

  // ================= SECURITY (Huntress last-48h activity + CIPP M365 posture) =================
  async function fetchSecurityZone() {
    const since = encodeURIComponent(new Date(Date.now() - 48 * 3600 * 1000).toISOString());
    const [reportsRes, escRes, cippRes, orgsRes] = await Promise.allSettled([
      fetchOne(`${ENDPOINTS.huntress}/incident_reports?created_at_min=${since}&limit=25`),
      fetchOne(`${ENDPOINTS.huntress}/escalations?created_at_min=${since}&limit=25`),
      fetchOne(ENDPOINTS.cipp),
      fetchOne(`${ENDPOINTS.huntress}/organizations?limit=500`),
    ]);
    if (reportsRes.status === 'rejected' && escRes.status === 'rejected' && cippRes.status === 'rejected') {
      throw new Error('Huntress and CIPP both unreachable');
    }
    const reports = reportsRes.status === 'fulfilled' ? reportsRes.value : {};
    const escalations = escRes.status === 'fulfilled' ? escRes.value : {};
    const cipp = cippRes.status === 'fulfilled' ? cippRes.value : null;

    // CONFIRMED against a live payload: incident_reports carry organization_id
    // only, no organization_name field and no nested organization object.
    // Names have to be resolved separately via /organizations. Without this,
    // every incident silently showed "Unknown" — which is what was happening.
    const orgs = orgsRes.status === 'fulfilled' ? (orgsRes.value.organizations || []) : [];
    const orgNameById = new Map(orgs.map(o => [o.id, o.name]));

    function humanizePlatform(p) {
      if (!p) return 'Incident';
      return p.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    const openIncidents = (reports.incident_reports || reports.data || []).map(r => ({
      id: r.id,
      org: orgNameById.get(r.organization_id) || (r.subject && (r.subject.match(/\(([^)]+)\)\s*$/) || [])[1]) || 'Unknown',
      type: humanizePlatform(r.platform || r.indicator_type),
      status: r.status,
      severity: r.severity || 'high',
      createdAt: r.created_at || r.sent_at,
    }));
    return {
      openIncidents: openIncidents.filter(x => !isInactiveClient(x.org)),
      escalations: (escalations.escalations || escalations.data || []).filter(x => !isInactiveClient(orgNameById.get(x.organization_id))),
      avgSecureScore: cipp ? cipp.avgSecureScore : null,
      avgMfaPercent: cipp ? cipp.avgMfaPercent : null,
      lowScoreTenants: (cipp ? cipp.lowScoreTenants || [] : []).filter(t => !isInactiveClient(t.tenant)),
      lowMfaTenants: (cipp ? cipp.lowMfaTenants || [] : []).filter(t => !isInactiveClient(t.tenant)),
    };
  }
  function renderSecurity(data, filter, sort) {
    filter = filter || 'all';
    sort = sort || 'priority';
    const body = document.getElementById('body-security');

    if (filter === 'avanan') {
      body.innerHTML = `
        <div class="stat-row">
          <div class="stat"><div class="stat-num" style="color:var(--text-dim)">—</div><div class="stat-label">Avanan Not Connected</div></div>
        </div>
        <div class="empty-state">Avanan isn't deployed yet — this is a placeholder slot, ready to wire in once avanan-mcp is live.</div>
      `;
      return;
    }

    let inc = filter === 'cipp' ? [] : (data.openIncidents || []);
    const lowScore = filter === 'huntress' ? [] : (data.lowScoreTenants || []);
    const lowMfa = filter === 'huntress' ? [] : (data.lowMfaTenants || []);

    const SEV_RANK = { critical: 3, high: 2, medium: 1, low: 0 };
    const stillOpen = inc.filter(x => x.status !== 'closed' && x.status !== 'dismissed');

    // Normalize incidents + low-score tenants + low-MFA tenants into one
    // common row shape with a single comparable rank, so they sort as ONE
    // worst-first list instead of three sequential blocks (which would let
    // a closed incident sit above a critical secure-score gap just because
    // incidents render first).
    const rows = [
      ...inc.map(x => {
        const closed = x.status === 'closed' || x.status === 'dismissed';
        return {
          rank: sort === 'newest' ? new Date(x.createdAt).getTime() : (closed ? 0 : 1000) + (SEV_RANK[x.severity] || 0) * 10 + new Date(x.createdAt).getTime() / 1e13,
          html: `<div class="row" style="${closed ? 'opacity:0.55;' : ''}">
            <div class="row-main">
              <div class="row-title">${escapeHtml(x.org)} — ${escapeHtml(x.type)}</div>
              <div class="row-sub">${escapeHtml((x.status || '').toUpperCase())} · ${minutesSince(x.createdAt)} ago</div>
            </div>
            <div class="row-badge ${closed ? 'badge-info' : x.severity === 'critical' ? 'badge-crit' : x.severity === 'high' ? 'badge-high' : 'badge-info'}">${escapeHtml((x.severity || '').toUpperCase())}</div>
          </div>`
        };
      }),
      ...lowScore.map(t => ({
        rank: sort === 'newest' ? -1 : 700 + (50 - (t.securePercent || 0)),
        html: `<div class="row">
          <div class="row-main">
            <div class="row-title">${escapeHtml(t.tenant)} — Low Secure Score</div>
            <div class="row-sub">M365 tenant</div>
          </div>
          <div class="row-badge badge-crit">${t.securePercent}% score</div>
        </div>`
      })),
      ...lowMfa.map(t => ({
        rank: sort === 'newest' ? -2 : 500 + (80 - (t.mfaPercent || 0)),
        html: `<div class="row">
          <div class="row-main">
            <div class="row-title">${escapeHtml(t.tenant)} — Low MFA coverage</div>
            <div class="row-sub">M365 tenant</div>
          </div>
          <div class="row-badge badge-high">${t.mfaPercent}% MFA</div>
        </div>`
      })),
    ];
    rows.sort((a, b) => b.rank - a.rank);

    body.innerHTML = `
      <div class="stat-row">
        ${filter !== 'cipp' ? `<div class="stat"><div class="stat-num" style="color:${stillOpen.length ? 'var(--red)' : 'var(--green)'}">${stillOpen.length}</div><div class="stat-label">Still Open</div></div>
        <div class="stat"><div class="stat-num">${inc.length}</div><div class="stat-label">Incidents (48h)</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--amber)">${(filter === 'cipp' ? [] : (data.escalations || [])).length}</div><div class="stat-label">Escalations (48h)</div></div>` : ''}
        ${filter !== 'huntress' && data.avgSecureScore != null ? `<div class="stat"><div class="stat-num" style="color:${data.avgSecureScore < 50 ? 'var(--red)' : 'var(--green)'}">${data.avgSecureScore}%</div><div class="stat-label">Avg Secure Score</div></div>` : ''}
        ${filter !== 'huntress' && data.avgMfaPercent != null ? `<div class="stat"><div class="stat-num" style="color:${data.avgMfaPercent < 80 ? 'var(--amber)' : 'var(--green)'}">${data.avgMfaPercent}%</div><div class="stat-label">Avg MFA Coverage</div></div>` : ''}
      </div>
      ${rows.map(r => r.html).join('')}
      ${rows.length === 0 ? '<div class="empty-state">No security activity in the last 48 hours</div>' : ''}
    `;
  }
  function demoSecurity() {
    return {
      openIncidents: [
        { org: "BCFO", type: "Ransomware", status: "closed", severity: "critical", createdAt: new Date(Date.now()-30*3600000).toISOString() },
        { org: "Battlefield Fire Protection", type: "Suspicious login", status: "sent", severity: "high", createdAt: new Date(Date.now()-40*60000).toISOString() },
      ],
      escalations: [],
      avgSecureScore: 62,
      avgMfaPercent: 78,
      lowScoreTenants: [{ tenant: "James River Ford", securePercent: 41 }],
      lowMfaTenants: [{ tenant: "SJP Law Firm", mfaPercent: 55 }],
    };
  }

  // ================= BUSINESS (Pax8 subscriptions + Meraki/Peplink license expiry) =================
  async function fetchBusinessZone() {
    const [pax8Res, companiesRes, merakiLicRes, peplinkLicRes] = await Promise.allSettled([
      fetchOne(`${ENDPOINTS.pax8}/subscriptions?status=Active&size=200`),
      fetchOne(`${ENDPOINTS.pax8}/companies?size=250`),
      fetchOne(ENDPOINTS.merakiLicenses),
      fetchOne(ENDPOINTS.peplinkLicenses),
    ]);
    if (pax8Res.status === 'rejected' && merakiLicRes.status === 'rejected' && peplinkLicRes.status === 'rejected') {
      throw new Error('Pax8, Meraki, and Peplink all unreachable');
    }

    // CONFIRMED field names (checked against a live subscription payload,
    // not guessed): the renewal date lives at commitment.endDate, not a
    // top-level endDate, and billingTerm comes back capitalized ("Monthly").
    // Subscriptions only carry a companyId GUID, no name — resolved via a
    // second /companies call, matched on guid (not the numeric id field).
    let pax8Renewals = [];
    if (pax8Res.status === 'fulfilled') {
      const data = pax8Res.value;
      const subs = data.content || data || [];

      const companies = companiesRes.status === 'fulfilled'
        ? (companiesRes.value.records || companiesRes.value.content || companiesRes.value || [])
        : [];
      const nameByGuid = new Map(companies.map(c => [c.guid || c.id, c.name]));

      const now = Date.now();
      const in30Days = now + 30 * 24 * 3600 * 1000;
      const upcoming = subs.filter(s => {
        const end = s.commitment && s.commitment.endDate;
        if (!end) return false;
        const t = new Date(end).getTime();
        return t >= now && t < in30Days; // exclude anything already past — assumed lapsed/not renewing, not "upcoming"
      });
      pax8Renewals = upcoming.slice(0, 15).map(s => {
        const endDate = s.commitment.endDate;
        return {
          company: nameByGuid.get(s.companyId) || s.companyId || 'Unknown',
          product: s.productName || 'Subscription',
          renewalDate: new Date(endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
          mrr: (s.billingTerm || '').toLowerCase() === 'monthly' ? Math.round((s.price || 0) * (s.quantity || 1)) : 0,
          source: 'Pax8',
        };
      });
    }

    const merakiRenewals = merakiLicRes.status === 'fulfilled' ? (merakiLicRes.value.upcomingRenewals || []) : [];
    const peplinkRenewals = peplinkLicRes.status === 'fulfilled' ? (peplinkLicRes.value.upcomingRenewals || []) : [];

    const upcomingRenewals = [...pax8Renewals, ...merakiRenewals, ...peplinkRenewals].filter(r => !isInactiveClient(r.company));
    const mrrAtRisk = upcomingRenewals.reduce((sum, r) => sum + (r.mrr || 0), 0);
    return { mrrAtRisk, upcomingRenewals };
  }
  function renderBusiness(data, filter, sort) {
    filter = filter || 'all';
    sort = sort || 'priority';
    const body = document.getElementById('body-business');
    const all = data.upcomingRenewals || [];
    let r = filter === 'all' ? all : all.filter(x => (x.source || '').toLowerCase() === filter);
    const mrrAtRisk = r.reduce((sum, x) => sum + (x.mrr || 0), 0);

    r = [...r].sort((a, b) => {
      if (sort === 'mrr') return (b.mrr || 0) - (a.mrr || 0);
      if (sort === 'az') return a.company.localeCompare(b.company);
      // priority: soonest renewal first — most urgent business risk
      const da = parseShortDate(a.renewalDate);
      const db = parseShortDate(b.renewalDate);
      if (!da || !db) return 0;
      return da - db;
    });

    body.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${r.length}</div><div class="stat-label">Renewals (30-60d)</div></div>
        <div class="stat"><div class="stat-num">$${mrrAtRisk.toLocaleString()}</div><div class="stat-label">MRR at Risk</div></div>
      </div>
      ${r.map(x => `
        <div class="row">
          <div class="row-main">
            <div class="row-title">${escapeHtml(x.company)} — ${escapeHtml(x.product)}</div>
            <div class="row-sub">${escapeHtml(x.source || '')} · renews ${escapeHtml(x.renewalDate)}</div>
          </div>
          <div class="row-badge badge-info">${x.mrr ? '$' + x.mrr.toLocaleString() : escapeHtml(x.source || '')}</div>
        </div>`).join('') || `<div class="empty-state">Nothing renewing soon${filter !== 'all' ? ' from ' + escapeHtml(filter) : ''}</div>`}
    `;
  }
  function demoBusiness() {
    return { mrrAtRisk: 4200, upcomingRenewals: [
      { company: "Gold Mechanical", product: "M365 Business Premium", renewalDate: "Aug 3", mrr: 2100, source: "Pax8" },
      { company: "Habitat for Humanity", product: "Acronis Backup", renewalDate: "Aug 9", mrr: 380, source: "Pax8" },
      { company: "SJP Law Firm, LLC", product: "Meraki License", renewalDate: "Aug 20", mrr: 0, source: "Meraki" },
      { company: "Altec Solutions Group", product: "Peplink Balance 380X — Warranty", renewalDate: "Sep 1", mrr: 0, source: "Peplink" },
    ]};
  }
